services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ihsg
      POSTGRES_PASSWORD: ihsg
      POSTGRES_DB: ihsg_screener
    ports:
      - "5432:5432"
    volumes:
      - ihsg_postgres_data:/var/lib/postgresql/data

volumes:
  ihsg_postgres_data:
